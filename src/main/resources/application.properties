# ===============================
# APPLICATION
# ===============================
spring.application.name=portfolio-api
application.version=2.0.0

# ===============================
# SERVER
# ===============================
server.port=${PORT:8082}
server.servlet.context-path=/portfolioApi

# ===============================
# DATABASE (Neon PostgreSQL)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
# Use 'update' so Hibernate automatically creates any missing columns (e.g. description) without dropping data.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
# ===============================
# RESEND EMAIL CONFIG (Recommended for Render/Cloud - HTTPS Port 443)
# ===============================
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:Sarang <onboarding@resend.dev>}

# ===============================
# BREVO EMAIL CONFIG (Free Alternative for Cloud - HTTPS Port 443)
# ===============================
brevo.api.key=${BREVO_API_KEY:}
brevo.from.email=${BREVO_FROM_EMAIL:sarangsvkm@gmail.com}

# ===============================
# GMAIL SMTP FALLBACK CONFIG
# ===============================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
# CORS CONFIG
# ===============================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://sarangsvkm.in,https://www.sarangsvkm.in,https://*.sarangsvkm.in,https://portfolio-frontend-*.vercel.app,http://localhost:5173,http://localhost:3000}

# ===============================
# FILE UPLOAD LIMITS
# ===============================
spring.servlet.multipart.max-file-size=10MB
# ===============================
# OTP PRIVACY CONFIG
# ===============================
otp.expiry.minutes=10
