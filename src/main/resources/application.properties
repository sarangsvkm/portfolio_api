# ===============================
# APPLICATION
# ===============================
spring.application.name=portfolio-api
application.version=2.0.0

# ===============================
# SERVER
# ===============================
server.port=${PORT:8082}
server.servlet.context-path=/portfolioApi

# ===============================
# DATABASE (Neon PostgreSQL)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
# Override with SPRING_JPA_HIBERNATE_DDL_AUTO when a different mode is needed.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
# ===============================
# EMAIL CONFIG
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# CORS CONFIG
# ===============================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ===============================
# FILE UPLOAD LIMITS
# ===============================
spring.servlet.multipart.max-file-size=10MB
# ===============================
otp.expiry.minutes=10

# ===============================
# MEMORY OPTIMIZATIONS
# ===============================
# Speed up startup time and reduce memory footprint by lazy loading beans
spring.main.lazy-initialization=true
# Limit Tomcat worker threads to reduce thread stack memory overhead
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
# Limit connection pool size
spring.datasource.hikari.maximum-pool-size=5

# ===============================
# RESUME JSON SYNCHRONIZATION
# ===============================
# Write generated resume JSON file to the frontend's public folder during local development
resume.json.output-path=../portfolio-frontend/public/data/resume-data.json

# ===============================
# GEMINI AI CONFIG
# ===============================
gemini.api.key=${GEMINI_API_KEY:}
